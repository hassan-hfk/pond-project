<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Config Editor - Detection System</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        height: 100vh;
        overflow: hidden;
      }

      .container {
        display: flex;
        height: 100vh;
      }

      .sidebar {
        width: 200px;
        background-color: #2c3e50;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .sidebar-btn {
        width: 160px;
        padding: 15px 20px;
        margin: 10px 0;
        background-color: #34495e;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      .sidebar-btn:hover {
        background-color: #1abc9c;
      }

      .sidebar-btn.active {
        background-color: #1abc9c;
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        overflow-y: auto;
      }

      .config-panel {
        margin-bottom: 20px;
        padding: 20px;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }

      .section {
        margin-bottom: 25px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 5px;
        border-left: 4px solid #3498db;
      }

      .section-title {
        color: #2c3e50;
        margin-bottom: 15px;
        font-size: 18px;
        font-weight: bold;
      }

      .field-group {
        margin-bottom: 15px;
        padding: 10px;
        background: white;
        border-radius: 4px;
        border: 1px solid #e9ecef;
      }

      .field-row {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
        padding: 5px 0;
      }

      .field-label {
        width: 200px;
        font-weight: bold;
        color: #2c3e50;
        font-size: 14px;
      }

      .field-input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }

      .field-input:focus {
        outline: none;
        border-color: #3498db;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
      }

      .save-button {
        background-color: #27ae60;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        margin-top: 20px;
      }

      .save-button:hover {
        background-color: #219a52;
      }

      .status {
        margin-top: 15px;
        padding: 10px;
        background: #ecf0f1;
        border-radius: 5px;
        font-weight: bold;
      }

      .status.success {
        background: #d4edda;
        color: #155724;
      }

      .status.error {
        background: #f8d7da;
        color: #721c24;
      }

      .loading {
        text-align: center;
        padding: 20px;
        color: #6c757d;
        font-style: italic;
      }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <button class="sidebar-btn" onclick="window.location.href='/'">Detection</button>
            <button class="sidebar-btn" onclick="window.location.href='/roi_editor'">ROI Editor</button>
            <button class="sidebar-btn active">Config Editor</button>
            <button class="sidebar-btn" onclick="window.location.href='/?showEventList=true'">Event List</button>
            <button class="sidebar-btn" onclick="window.location.href='/calibration'">Calibration</button>
            <button class="sidebar-btn">Settings</button>
        </div>

        <div class="main-content">
            <div class="config-panel">
                <h2 style="color: #2c3e50; margin-bottom: 20px;">Configuration Editor</h2>
                <p style="margin-bottom: 20px; color: #6c757d;">Edit all configuration parameters. Changes will be saved to config.yaml</p>
                
                <div id="configForm">
                    <div class="loading" id="loadingMessage">Loading configuration...</div>
                </div>

                <button class="save-button" onclick="saveConfig()">Save All Configuration</button>
                <div class="status" id="statusText">Ready - Loading configuration...</div>
            </div>
        </div>
    </div>

    <script>
        let currentConfig = {};

        window.addEventListener('load', function() {
            loadFullConfig();
        });

        function loadFullConfig() {
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('statusText').textContent = 'Loading configuration...';
            document.getElementById('statusText').className = 'status';

            fetch('/get_full_config')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loadingMessage').style.display = 'none';
                    if (data.config) {
                        currentConfig = data.config;
                        renderConfigForm(data.config);
                        document.getElementById('statusText').textContent = 'Configuration loaded successfully';
                        document.getElementById('statusText').className = 'status success';
                    }
                })
                .catch(error => {
                    console.error('Error loading config:', error);
                    document.getElementById('loadingMessage').style.display = 'none';
                    document.getElementById('statusText').textContent = 'Error loading configuration';
                    document.getElementById('statusText').className = 'status error';
                });
        }

        function renderConfigForm(config) {
            const formContainer = document.getElementById('configForm');
            formContainer.innerHTML = '';

            // Render each section
            const sections = ['calibration', 'camera', 'gpio', 'logging', 'model', 'rois', 'thresholds'];
            
            sections.forEach(sectionName => {
                if (config[sectionName]) {
                    renderSection(formContainer, sectionName, config[sectionName]);
                }
            });
        }

        function renderSection(container, sectionName, sectionData) {
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'section';
            
            const title = document.createElement('div');
            title.className = 'section-title';
            title.textContent = sectionName.charAt(0).toUpperCase() + sectionName.slice(1);
            sectionDiv.appendChild(title);

            if (sectionName === 'rois') {
                // Special handling for ROIs
                const roiInfo = document.createElement('div');
                roiInfo.className = 'field-group';
                roiInfo.innerHTML = `
                    <div style="color: #6c757d; font-style: italic;">
                        ROIs are managed through the ROI Editor page.
                        Current ROIs: ${Array.isArray(sectionData) ? sectionData.length : 0}
                    </div>
                `;
                sectionDiv.appendChild(roiInfo);
            } else {
                // Render regular fields
                for (const [key, value] of Object.entries(sectionData)) {
                    const fieldGroup = document.createElement('div');
                    fieldGroup.className = 'field-group';
                    
                    if (Array.isArray(value)) {
                        renderArrayField(fieldGroup, sectionName, key, value);
                    } else if (typeof value === 'object' && value !== null) {
                        renderObjectField(fieldGroup, sectionName, key, value);
                    } else {
                        renderSimpleField(fieldGroup, sectionName, key, value);
                    }
                    
                    sectionDiv.appendChild(fieldGroup);
                }
            }
            
            container.appendChild(sectionDiv);
        }

        function renderSimpleField(container, section, key, value) {
            const fieldRow = document.createElement('div');
            fieldRow.className = 'field-row';
            
            const label = document.createElement('div');
            label.className = 'field-label';
            label.textContent = key.replace(/_/g, ' ');
            fieldRow.appendChild(label);
            
            const input = document.createElement('input');
            
            if (typeof value === 'boolean') {
                input.type = 'checkbox';
                input.checked = value;
            } else if (typeof value === 'number') {
                input.type = 'number';
                input.step = Number.isInteger(value) ? '1' : '0.01';
                input.value = value;
            } else {
                input.type = 'text';
                input.value = value === null ? '' : value;
            }
            
            input.className = 'field-input';
            input.setAttribute('data-section', section);
            input.setAttribute('data-key', key);
            input.setAttribute('data-type', typeof value);
            
            fieldRow.appendChild(input);
            container.appendChild(fieldRow);
        }

        function renderArrayField(container, section, key, array) {
            const label = document.createElement('div');
            label.className = 'field-label';
            label.textContent = key.replace(/_/g, ' ');
            label.style.marginBottom = '10px';
            container.appendChild(label);

            const arrayContainer = document.createElement('div');
            arrayContainer.id = `array-${section}-${key}`;
            
            array.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.style.marginBottom = '5px';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'field-input';
                input.value = item;
                input.setAttribute('data-section', section);
                input.setAttribute('data-key', key);
                input.setAttribute('data-index', index);
                
                itemDiv.appendChild(input);
                arrayContainer.appendChild(itemDiv);
            });
            
            container.appendChild(arrayContainer);
        }

        function renderObjectField(container, section, key, obj) {
            const label = document.createElement('div');
            label.className = 'field-label';
            label.textContent = key.replace(/_/g, ' ');
            label.style.marginBottom = '10px';
            container.appendChild(label);

            const objContainer = document.createElement('div');
            objContainer.style.marginLeft = '20px';
            objContainer.style.padding = '10px';
            objContainer.style.background = '#f8f9fa';
            objContainer.style.borderRadius = '4px';
            
            for (const [subKey, subValue] of Object.entries(obj)) {
                renderSimpleField(objContainer, `${section}.${key}`, subKey, subValue);
            }
            
            container.appendChild(objContainer);
        }

        function saveConfig() {
            const statusText = document.getElementById('statusText');
            statusText.textContent = 'Saving configuration...';
            statusText.className = 'status';

            // Collect all form data
            const updatedConfig = JSON.parse(JSON.stringify(currentConfig));
            
            // Get all inputs
            const inputs = document.querySelectorAll('input[data-section]');
            
            inputs.forEach(input => {
                const section = input.getAttribute('data-section');
                const key = input.getAttribute('data-key');
                const dataType = input.getAttribute('data-type');
                const index = input.getAttribute('data-index');
                
                // Skip ROIs - they should only be edited via ROI Editor
                if (section === 'rois') {
                    return;
                }
                
                let value;
                if (input.type === 'checkbox') {
                    value = input.checked;
                } else if (input.type === 'number') {
                    value = parseFloat(input.value);
                } else {
                    value = input.value;
                }
                
                // Handle nested sections (e.g., "calibration.ref_box")
                const sections = section.split('.');
                let target = updatedConfig;
                
                for (let i = 0; i < sections.length; i++) {
                    const s = sections[i];
                    if (i === sections.length - 1) {
                        // Last section, set the value
                        if (index !== null) {
                            // Array item
                            if (!Array.isArray(target[s][key])) {
                                target[s][key] = [];
                            }
                            target[s][key][parseInt(index)] = value;
                        } else {
                            // Regular value
                            target[s][key] = value;
                        }
                    } else {
                        // Navigate deeper
                        if (!target[s]) target[s] = {};
                        target = target[s];
                    }
                }
            });

            // Remove ROIs from the config being sent (keep them unchanged on server)
            delete updatedConfig.rois;

            console.log('Sending config (ROIs excluded):', updatedConfig);

            fetch('/save_full_config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ config: updatedConfig })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    statusText.textContent = '✅ Configuration saved successfully!';
                    statusText.className = 'status success';
                } else {
                    throw new Error(data.message || 'Unknown error');
                }
            })
            .catch(error => {
                console.error('Error saving config:', error);
                statusText.textContent = '❌ Error saving configuration: ' + error.message;
                statusText.className = 'status error';
            });
        }
    </script>
</body>
</html>
